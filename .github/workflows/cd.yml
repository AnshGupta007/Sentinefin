name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      run_backtest:
        description: "Also run the leakage-free backtest"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  deploy-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pyarrow anthropic openai
          pip install -e ".[dev]"
      - name: Download CFPB data and build panel + EDA
        run: sentinefin ingest
      - name: Embeddings + MLP baseline (Phase 2)
        run: sentinefin embed
      - name: DEC clustering over windows (Phase 3)
        run: sentinefin cluster
      - name: LSTM-AE emergence scoring (Phase 4)
        run: sentinefin drift
      - name: Backtest (optional, Phase 5)
        if: ${{ inputs.run_backtest }}
        run: sentinefin backtest
      - name: Build HTML report (Phase 6)
        run: sentinefin report
      - name: Upload artifacts (panel, embeddings, metrics, report)
        uses: actions/upload-artifact@v4
        with:
          name: sentinefin-artifacts-${{ github.run_id }}
          path: |
            outputs/
            reports/
            data/processed/
          retention-days: 14

  docker-image:
    runs-on: ubuntu-latest
    needs: deploy-pipeline
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sentinefin:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image CLI entrypoint
        env:
          SENTINEFIN_SMOKE: "1"
        run: docker run --rm sentinefin:${{ github.ref_name }} pipeline --smoke --skip-eda
